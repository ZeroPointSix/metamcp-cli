version: 2

project_name: mcli

builds:
  - id: mcli
    main: ./cmd/mcli
    binary: mcli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ZeroPointSix/metamcp-cli/internal/version.Version={{ .Tag }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: mcli
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version-less names let install scripts use releases/latest/download/.
    name_template: "mcli_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  # Tags like v0.2.0-rc.1 are marked as GitHub pre-releases.
  prerelease: auto

changelog:
  use: github
