name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The Windows named-pipe daemon path has not been verified on a real
    # machine yet; keep its result visible without blocking merges.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build all npm platform packages
        run: node npm/build.mjs 0.0.0-ci "$RUNNER_TEMP/npm"
      - name: Smoke-test the npm launcher
        run: |
          cd "$RUNNER_TEMP/npm/mcli"
          MCLI_BINARY="$RUNNER_TEMP/npm/mcli-linux-x64/bin/mcli" node bin/mcli.js --version

  install-scripts:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Each step builds a fake release, serves it locally and installs from it.
      - name: install.sh against a local release
        if: runner.os != 'Windows'
        run: |
          set -eu
          rel="$RUNNER_TEMP/rel"; mkdir -p "$rel" "$RUNNER_TEMP/stage"
          archive="mcli_$(go env GOOS)_$(go env GOARCH).tar.gz"
          CGO_ENABLED=0 go build -ldflags "-X github.com/ZeroPointSix/metamcp-cli/internal/version.Version=v0.0.0-ci" -o "$RUNNER_TEMP/stage/mcli" ./cmd/mcli
          tar -czf "$rel/$archive" -C "$RUNNER_TEMP/stage" mcli
          (cd "$rel" && shasum -a 256 "$archive" > checksums.txt)
          (cd "$rel" && python3 -m http.server 18765 >/dev/null 2>&1 &)
          sleep 2
          MCLI_DOWNLOAD_BASE=http://127.0.0.1:18765 MCLI_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/mcli" --version | grep -q v0.0.0-ci
          # A tampered checksum must abort the install.
          sed -i.bak '1s/^./0/' "$rel/checksums.txt"
          if MCLI_DOWNLOAD_BASE=http://127.0.0.1:18765 MCLI_INSTALL_DIR="$RUNNER_TEMP/bad" sh install.sh; then
            echo "install succeeded despite a bad checksum"; exit 1
          fi
      - name: install.ps1 against a local release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Join-Path $env:RUNNER_TEMP 'rel'; $stage = Join-Path $env:RUNNER_TEMP 'stage'
          New-Item -ItemType Directory -Force -Path $rel, $stage | Out-Null
          $archive = "mcli_windows_$(go env GOARCH).zip"
          $env:CGO_ENABLED = '0'
          go build -ldflags "-X github.com/ZeroPointSix/metamcp-cli/internal/version.Version=v0.0.0-ci" -o "$stage\mcli.exe" ./cmd/mcli
          Compress-Archive -Path "$stage\mcli.exe" -DestinationPath "$rel\$archive"
          $hash = (Get-FileHash -Algorithm SHA256 "$rel\$archive").Hash.ToLower()
          Set-Content -Path "$rel\checksums.txt" -Value "$hash  $archive"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '18765' -WorkingDirectory $rel -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          try {
            $env:MCLI_DOWNLOAD_BASE = 'http://127.0.0.1:18765'
            $env:MCLI_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
            $env:MCLI_NO_PATH = '1'
            ./install.ps1
            $v = & "$env:RUNNER_TEMP\bin\mcli.exe" --version
            if ($v -notmatch 'v0.0.0-ci') { throw "unexpected version: $v" }
            ./install.ps1   # re-running upgrades in place
            Set-Content -Path "$rel\checksums.txt" -Value ("0" * 64 + "  $archive")
            $env:MCLI_INSTALL_DIR = "$env:RUNNER_TEMP\bad"
            pwsh -NoProfile -File ./install.ps1
            if ($LASTEXITCODE -eq 0) { throw "install succeeded despite a bad checksum" }
            $global:LASTEXITCODE = 0
          } finally {
            Stop-Process -Id $server.Id -Force
          }
