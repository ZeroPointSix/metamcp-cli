name: Live smoke test

# Read-only checks against a real MetaMCP endpoint. Requires the repository
# secrets MCLI_LIVE_URL and MCLI_LIVE_API_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run 'TestLive' -v ./test/e2e/
        env:
          MCLI_LIVE_URL: ${{ secrets.MCLI_LIVE_URL }}
          MCLI_LIVE_API_KEY: ${{ secrets.MCLI_LIVE_API_KEY }}
